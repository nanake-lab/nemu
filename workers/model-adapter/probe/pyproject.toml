[project]
name = "nemu-carrier-probe"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.10.0+cu128",
  "torchaudio==2.10.0+cu128",
  "transformers==4.57.3",
  "accelerate==1.12.0",
  "bitsandbytes==0.50.2",
  "qwen-tts==0.1.1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "mypy==1.20.2", "ruff==0.15.6"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
strict = true

