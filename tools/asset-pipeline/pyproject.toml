[project]
name = "nemu-asset-pipeline"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["PyYAML==6.0.3", "jsonschema==4.26.0"]

[dependency-groups]
dev = ["pytest==9.1.1", "mypy==1.20.2", "ruff==0.15.6"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../texture-fix"]

[tool.ruff]
target-version = "py312"
