# P2-03 integration sample only; not Nemu design or approved aesthetic values.
# Paths are repository-relative. Every aesthetic value is explicit; no implicit defaults.
# tail.curve is a dimensionless polyline, resampled to lengthM and boneCount.
# radiusCurve entries are [arc fraction, radius in metres]. tipShape: flat or taper.
# profile dimensions/tailBones are measured; all other profile fields are contract validated.
# materials.Body_00_SKIN values below copy the sample VRM, without aesthetic retuning.
# pipelineProbe exercises binding serialization only; it is not a Nemu expression.
