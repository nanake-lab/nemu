  license: custom:VRM Public License 1.0 (embedded meta; pixiv Inc.)
  redistributable: true
  author: pixiv Inc.
  notes: Pipeline integration fixture derived from the repository sample; not approved
    Nemu appearance.
sourceChecks:
  bones:
  - hips
  - head
  - upperChest
  expressions:
  - happy
  - aa
  - blink
  materials:
  - Hair_00_HAIR
