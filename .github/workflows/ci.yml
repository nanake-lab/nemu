name: CI
# Changes that touch only documents, task cards, reports or the content submodule pointer
# cannot affect any check below, so they skip this workflow. Docs guard covers the frozen
# specs and the task catalog. The Windows job lives in windows.yml with its own path filter.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'tasks/**'
      - 'reports/**'
      - '**.md'
      - 'content'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'tasks/**'
      - 'reports/**'
      - '**.md'
      - 'content'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  UV_LINK_MODE: copy
jobs:
  scope:
    name: Ubuntu change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      storage: ${{ steps.scope.outputs.storage }}
      node: ${{ steps.scope.outputs.node }}
      python: ${{ steps.scope.outputs.python }}
      contracts: ${{ steps.scope.outputs.contracts }}
      dotnet: ${{ steps.scope.outputs.dotnet }}
      status: ${{ steps.scope.outputs.status }}
      causedemo: ${{ steps.scope.outputs.causedemo }}
      tools: ${{ steps.scope.outputs.tools }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Compare the complete PR, not just its latest commit. Pushes compare before..HEAD.
          fetch-depth: 0
      - name: Decide scope
        id: scope
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # A manual run or an unavailable comparison runs everything (fail closed).
          $full = $true
          $files = @()
          if ($env:EVENT -eq 'pull_request') {
            $files = @(git diff --name-only --no-renames "$($env:PR_BASE)...$($env:PR_HEAD)")
            $full = $LASTEXITCODE -ne 0
          } elseif ($env:EVENT -eq 'push' -and $env:BEFORE -and $env:BEFORE -notmatch '^0+$') {
            $files = @(git diff --name-only --no-renames $env:BEFORE HEAD)
            $full = $LASTEXITCODE -ne 0
          }
          $scope = @{ node = $false; python = $false; rust = $false; storage = $false; contracts = $false; dotnet = $false; status = $false; causedemo = $false }
          foreach ($f in $files) {
            if ($f -match '\.md$|^(docs/|tasks/|reports/|content$)') { continue }
            if ($f -match '^\.github/workflows/') { $full = $true; continue }
            if ($f -match '^tools/cause-demo/') { $scope.causedemo = $true; continue }
            $known = $false
            if ($f -match '^(apps/|packages/|tools/|spikes/|executors/codex-bridge/)') {
              $scope.node = $true; $known = $true
            }
            if ($f -match '^(workers/|services/)') { $scope.python = $true; $known = $true }
            if ($f -match '^core/') { $scope.rust = $true; $known = $true }
            # core-store currently depends on core-types and frozen contract fixtures.
            # Include workspace/lock/toolchain/config changes; update this with new path deps.
            if ($f -match '^core/(crates/(core-store|core-types)/|contracts/|\.cargo/|[^/]+$)') {
              $scope.storage = $true
            }
            if ($f -match '^(core/(contracts/|crates/core-types/|\.cargo/|[^/]+$)|packages/contracts/|workers/irl/generated/)') {
              $scope.contracts = $true
            }
            if ($f -match '^executors/office-connector/') { $scope.dotnet = $true; $known = $true }
            if ($f -match '^tools/status/') { $scope.status = $true }
            # New directories and shared root build/toolchain files cannot silently miss checks.
            if (-not $known) { $full = $true }
          }
          if ($full) { foreach ($key in @($scope.Keys)) { $scope[$key] = $true } }
          # Contract/generated-type edits also exercise every Python consumer.
          # Three-language conformance needs both the Node and Python toolchains.
          if ($scope.contracts) { $scope.node = $true; $scope.python = $true }
          foreach ($key in ($scope.Keys | Sort-Object)) {
            $value = $scope[$key].ToString().ToLowerInvariant()
            "$key=$value" >> $env:GITHUB_OUTPUT
            $message = if ($scope[$key]) { 'run' } else { '无相关改动' }
            "$key`: $message" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          $tools = $scope.node -or $scope.python -or $scope.dotnet -or $scope.status -or $scope.causedemo
          "tools=$($tools.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "full=$full; changed files=$($files.Count)"
          # A failed diff selected the full suite; do not propagate its native exit code.
          $global:LASTEXITCODE = 0

  rust:
    name: Ubuntu Rust workspace
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Retain reusable compilation output without archiving incremental state.
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          persist-credentials: false
          fetch-depth: 0
      - name: Restore Rust build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            core/target
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('core/rust-toolchain.toml', 'core/Cargo.lock', 'core/.cargo/config*') }}
      - name: Rust checks
        working-directory: core
        run: |
          rustup show
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --locked --exclude core-store
      - name: W19 optional CPU runtime compile checks (no model download)
        working-directory: core
        run: cargo clippy -p fact-view --all-targets --features cpu-embedding --locked -- -D warnings

  storage:
    name: Ubuntu core-store
    needs: scope
    if: needs.scope.outputs.storage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Retain reusable compilation output without archiving incremental state.
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          persist-credentials: false
          fetch-depth: 0
      - name: Restore Rust build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            core/target
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-storage-${{ hashFiles('core/rust-toolchain.toml', 'core/Cargo.lock', 'core/.cargo/config*') }}
      - name: core-store tests (including crash recovery)
        working-directory: core
        run: cargo test -p core-store --locked
      - name: P5-36 bounded writer lock lifecycle evidence (Linux)
        working-directory: core
        run: cargo test -p core-store --locked platform::tests::writer_lock -- --nocapture

  tools:
    name: Ubuntu Node, Python and .NET checks
    needs: scope
    if: needs.scope.outputs.tools == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: needs.scope.outputs.node == 'true'
        with:
          node-version-file: .nvmrc
      - if: needs.scope.outputs.node == 'true'
        run: npm install --global pnpm@12.11.2
      - if: needs.scope.outputs.node == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install locked Electron binary before tests
        if: needs.scope.outputs.node == 'true'
        shell: pwsh
        timeout-minutes: 5
        run: |
          # Bound release-download retries to three attempts, 15 seconds apart.
          # The locked package installer retains its bundled checksum validation.
          foreach ($attempt in 1..3) {
            node node_modules/electron/install.js
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds 15 }
          }
          exit 1
      - if: needs.scope.outputs.node == 'true'
        run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - if: needs.scope.outputs.node == 'true'
        run: pnpm test:contracts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && needs.scope.outputs.node == 'true'
        with:
          name: contracts-coverage
          path: reports/P0-02/coverage/
      - if: needs.scope.outputs.node == 'true'
        run: pnpm test:transport
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        if: needs.scope.outputs.python == 'true' || needs.scope.outputs.contracts == 'true'
        with:
          version: '0.12.15'
          python-version: '3.12'
      - name: Python checks (all four projects)
        if: needs.scope.outputs.python == 'true'
        shell: pwsh
        run: |
          foreach ($project in @('workers/irl', 'workers/drive', 'workers/model-adapter', 'services/voice-sidecar')) {
            Push-Location $project
            try {
              uv sync --locked
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              uv run ruff check .
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              uv run mypy --strict src tests
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              uv run pytest
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              uv build
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } finally { Pop-Location }
          }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        if: needs.scope.outputs.dotnet == 'true'
        with:
          global-json-file: executors/office-connector/global.json
      - if: needs.scope.outputs.dotnet == 'true'
        run: dotnet build executors/office-connector/OfficeConnector.csproj --configuration Release
      - name: Hosted minutes estimate
        if: needs.scope.outputs.node == 'true'
        env:
          CI_FREE_MINUTES: ${{ vars.CI_FREE_MINUTES || '2000' }}
          CI_MONTHLY_RUNS: ${{ vars.CI_MONTHLY_RUNS || '60' }}
          CI_HOSTED_MINUTES_PER_RUN: ${{ vars.CI_HOSTED_MINUTES_PER_RUN || '20' }}
        run: pnpm ci:budget
      - name: P5-01 IDL and three-language conformance (D10.8 / SYS21)
        if: needs.scope.outputs.contracts == 'true'
        run: |
          pnpm test:core-contracts
          uv run --project core/contracts --locked ruff check core/contracts workers/irl/generated/echo
          uv run --project core/contracts --locked mypy --strict core/contracts/generate.py core/contracts/fixture_inputs.py core/contracts/adversarial.py core/contracts/verify.py workers/irl/generated/echo
      - name: P5-21 contract compatibility tooling (no reuse; checked by test:core-contracts)
        if: needs.scope.outputs.contracts == 'true'
        env:
          # Match fixture_law_state's runtime search path for standalone mypy.
          MYPYPATH: ${{ github.workspace }}/workers/irl/generated
        run: |
          uv run --project core/contracts --locked mypy --strict core/contracts/check_compat.py core/contracts/freeze_vectors.py
      - name: P2-05 residual signal metrics (no browser or private assets)
        if: needs.scope.outputs.node == 'true'
        run: pnpm test:p205:metrics
      - name: Status board pause and reminder regressions
        if: needs.scope.outputs.status == 'true'
        run: python -m unittest discover -s tools/status -p 'test_*.py' -v
      - name: cause-demo unit tests
        if: needs.scope.outputs.causedemo == 'true'
        run: python -m unittest discover -s tools/cause-demo -p 'test_*.py' -v

  hosted:
    # Preserve the public check name and fail if any selected job did not succeed.
    name: Ubuntu static checks and unit tests
    needs: [scope, rust, storage, tools]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require every selected Ubuntu job
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUST_SELECTED: ${{ needs.scope.outputs.rust == 'true' }}
          RUST_RESULT: ${{ needs.rust.result }}
          STORAGE_SELECTED: ${{ needs.scope.outputs.storage == 'true' }}
          STORAGE_RESULT: ${{ needs.storage.result }}
          TOOLS_SELECTED: ${{ needs.scope.outputs.tools == 'true' }}
          TOOLS_RESULT: ${{ needs.tools.result }}
        run: |
          if [[ "$SCOPE_RESULT" != success ]]; then
            echo "::error::Ubuntu change scope did not succeed ($SCOPE_RESULT)"
            exit 1
          fi
          require_job() {
            local name="$1" selected="$2" result="$3"
            if [[ "$result" == success || ( "$selected" == false && "$result" == skipped ) ]]; then
              return 0
            fi
            echo "::error::$name selected=$selected result=$result"
            return 1
          }
          require_job Rust "$RUST_SELECTED" "$RUST_RESULT"
          require_job core-store "$STORAGE_SELECTED" "$STORAGE_RESULT"
          require_job tools "$TOOLS_SELECTED" "$TOOLS_RESULT"
