name: R-STEER-PAIR offline checks
on:
  pull_request:
    paths: ['tools/r-steer-pair/**', '.github/workflows/r-steer-pair.yml']
  push:
    branches: [main]
    paths: ['tools/r-steer-pair/**', '.github/workflows/r-steer-pair.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - run: node --check tools/r-steer-pair/app.js
      - run: node --check tools/r-steer-pair/prepare.mjs
      - run: node --test tools/r-steer-pair/study.test.mjs
