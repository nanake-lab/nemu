name: core-store hosted timings

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Full commit SHA to compare on the same runner (leave empty for baseline only)
        type: string
        required: false

permissions:
  contents: read

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      BASELINE: 6734adc2bfe8b145e8062a2fc669dd2024dd2ba6
      CANDIDATE: ${{ inputs.candidate }}
      RUSTUP_TOOLCHAIN: 1.99.0
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Measure core-store on stable Rust
        # Leave time on the hosted VM to upload partial evidence.
        timeout-minutes: 320
        shell: python
        run: |
          import json
          import os
          import platform
          import re
          import statistics
          import subprocess
          import time
          from collections import Counter
          from pathlib import Path

          evidence = Path(os.environ["RUNNER_TEMP"]) / "perf-store"
          evidence.mkdir()
          revisions = {"baseline": os.environ["BASELINE"]}
          if candidate := os.environ["CANDIDATE"]:
              if not re.fullmatch(r"[0-9a-f]{40}", candidate):
                  raise ValueError("candidate must be a full lowercase commit SHA")
              revisions["candidate"] = candidate

          cargo = ["cargo", "test", "-p", "core-store", "--locked"]
          baseline_tests = None

          def listing(target):
              output = subprocess.check_output([*cargo, *target, "--", "--list"], cwd="core", text=True)
              return [line.removesuffix(": test") for line in output.splitlines() if line.endswith(": test")]

          def measure(target, names, exact, log):
              args = [*cargo, *target, "--", "--test-threads=1", "--format=pretty", "--color=never"]
              if exact:
                  args.extend(["--exact", exact])
              start = time.perf_counter()
              run = subprocess.run(args, cwd="core", capture_output=True, text=True)
              process_s = time.perf_counter() - start
              log.write_text(run.stderr + run.stdout)
              run.check_returncode()
              passed = re.findall(r"^test (.+) \.\.\. ok$", run.stdout, re.M)
              summaries = re.findall(r"^test result: ok\. (\d+) passed; .*?finished in ([\d.]+)s$", run.stdout, re.M)
              if (Counter(passed) != Counter(names) or sum(int(n) for n, _ in summaries) != len(names)
                      or re.search(r"^\s*Compiling ", run.stderr, re.M)):
                  raise RuntimeError(f"Unexpected tests, timing summary or rebuild: {log.name}")
              return {"passed": len(passed), "process_s": process_s,
                      "harness_s": sum(float(s) for _, s in summaries)}

          for label, sha in revisions.items():
              subprocess.run(["git", "switch", "--detach", sha], check=True)
              out = evidence / label
              out.mkdir()
              metadata = {"revision": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                          "image": os.environ["ImageVersion"], "os": platform.platform(),
                          "arch": platform.machine(), "runner": os.environ["RUNNER_NAME"]}
              if metadata["revision"] != sha:
                  raise RuntimeError("Checked out a different revision than requested")
              for tool in ("cargo", "rustc"):
                  metadata[tool] = subprocess.check_output([tool, "-Vv"], cwd="core", text=True).strip()
              (out / "environment.json").write_text(json.dumps(metadata, indent=2))
              # Build and discover outside all sample clocks (including rustdoc discovery).
              subprocess.run([*cargo, "--no-run"], cwd="core", check=True)
              all_names = listing([])
              tests = {target: listing([target]) for target in ("--lib", "--doc")}
              names = tests["--lib"] + tests["--doc"]
              if not names or Counter(names) != Counter(all_names) or len(set(names)) != len(names):
                  raise RuntimeError("Package inventory differs from library and doctest inventories")
              (out / "tests.json").write_text(json.dumps(tests, indent=2))
              inventory = {target: sorted(items) for target, items in tests.items()}
              if label == "baseline":
                  baseline_tests = inventory
              elif inventory != baseline_tests:
                  raise RuntimeError("Candidate test inventory differs from baseline")
              samples = {name: [] for name in ["<package>", *names]}
              with (out / "samples.jsonl").open("w") as raw:
                  for repeat in range(1, 4):
                      for index, name in enumerate(samples):
                          target = [] if index == 0 else ["--lib" if name in tests["--lib"] else "--doc"]
                          row = measure(target, names if index == 0 else [name], name if index else None,
                                        out / f"run-{repeat}-{index}.log")
                          samples[name].append(row)
                          print(json.dumps({"run": repeat, "test": name, **row}), file=raw, flush=True)
              medians = [{"test": name, **{key: statistics.median(row[key] for row in rows)
                                           for key in ("harness_s", "process_s")}}
                         for name, rows in samples.items()]
              (out / "medians.json").write_text(json.dumps(medians, indent=2))
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  print(f"### {label} `{sha}` ({len(names)} tests, three runs)\n", file=summary)
                  print("| Test | Harness median (s) | Process median (s) |\n|---|---:|---:|", file=summary)
                  slowest = sorted(medians[1:], key=lambda row: row["harness_s"], reverse=True)[:15]
                  for row in [medians[0], *slowest]:
                      print(f"| `{row['test']}` | {row['harness_s']:.2f} | {row['process_s']:.3f} |", file=summary)

      - name: Collect timings and test logs (including partial runs)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-store-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/perf-store/
          if-no-files-found: error

      - name: Check out FlameGraph rendering scripts
        if: runner.os == 'Linux' && success()
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: brendangregg/FlameGraph
          ref: 41fee1f99f9276008b7cd112fca19dc3ea84ac32
          path: flamegraph-tools
          persist-credentials: false

      - name: Enable perf on the Ubuntu hosted VM
        if: runner.os == 'Linux' && success()
        shell: bash
        run: |
          sudo sysctl kernel.perf_event_paranoid=1
          sudo apt-get update -qq
          sudo apt-get install -y linux-tools-generic
          # The generic perf binary supports software events on the hosted VM's kernel.
          perf_bin=$(find /usr/lib/linux-tools -type f -name perf | sort -V | tail -n 1)
          "$perf_bin" --version
          echo "PERF_BIN=$perf_bin" >> "$GITHUB_ENV"

      - name: Profile the five slowest tests per revision
        if: runner.os == 'Linux' && success()
        shell: python
        run: |
          import json
          import os
          import subprocess
          from pathlib import Path

          timings = Path(os.environ["RUNNER_TEMP"]) / "perf-store"
          profiles = timings.with_name("perf-store-profiles")
          tools = Path("flamegraph-tools").resolve()
          perf = os.environ["PERF_BIN"]
          for timed in sorted(timings.iterdir()):
              sha = json.loads((timed / "environment.json").read_text())["revision"]
              subprocess.run(["git", "switch", "--detach", sha], check=True)
              tests = json.loads((timed / "tests.json").read_text())
              medians = json.loads((timed / "medians.json").read_text())
              ranked = sorted((row for row in medians if row["test"] != "<package>"),
                              key=lambda row: row["harness_s"], reverse=True)[:5]
              # Build outside perf to exclude compilation. Test-profile defaults retain symbols.
              cargo = ["cargo", "test", "-p", "core-store", "--locked"]
              subprocess.run([*cargo, "--no-run"], cwd="core", check=True)
              for rank, row in enumerate(ranked, 1):
                  name = row["test"]
                  target = "--lib" if name in tests["--lib"] else "--doc"
                  out = profiles / timed.name / str(rank)
                  out.mkdir(parents=True)
                  args = [*cargo, target, "--", "--exact", name, "--test-threads=1", "--color=never"]
                  (out / "test.json").write_text(json.dumps({"revision": sha, "command": args, **row}, indent=2))
                  data = str(out / "perf.data")
                  with (out / "test.log").open("w") as log:
                      subprocess.run([perf, "record", "-e", "cpu-clock:u", "-F", "99",
                                      "--call-graph", "dwarf", "-o", data, "--", *args],
                                     cwd="core", stdout=log, stderr=subprocess.STDOUT, check=True)
                  if f"test {name} ... ok" not in (out / "test.log").read_text():
                      raise RuntimeError(f"Profiled test did not pass: {name}")
                  with (out / "functions.txt").open("w") as report:
                      subprocess.run([perf, "report", "--stdio", "--no-children", "--percent-limit", "0",
                                      "-i", data], stdout=report, check=True)
                  with (out / "stacks.folded").open("w") as folded:
                      with subprocess.Popen([perf, "script", "-i", data], stdout=subprocess.PIPE) as stacks:
                          subprocess.run(["perl", tools / "stackcollapse-perf.pl"], stdin=stacks.stdout,
                                         stdout=folded, check=True)
                          if stacks.wait() != 0:
                              raise RuntimeError("perf script failed")
                  if not (out / "stacks.folded").stat().st_size:
                      raise RuntimeError("No stack samples")
                  with (out / "flamegraph.svg").open("w") as graph:
                      subprocess.run(["perl", tools / "flamegraph.pl", out / "stacks.folded"],
                                     stdout=graph, check=True)

      - name: Collect Ubuntu profiles including partial results
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-store-profiles-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/perf-store-profiles/
          if-no-files-found: warn
