[project]
name = "nemu-asr-alignment-evaluation"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "qwen-asr==0.0.6",
  "torch==2.10.0+cpu",
  "numpy==2.2.6",
  "soundfile==0.13.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
