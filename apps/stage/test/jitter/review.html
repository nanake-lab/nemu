<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>P2-05 A 尾巴与弹簧候选评审</title>
<style>body{margin:0;font:15px system-ui;background:#171b24;color:#f4f3ef}header{padding:14px 22px;border-bottom:1px solid #454855}main{display:flex;height:calc(100vh - 65px)}#viewport-container{position:relative;flex:1;background:#eee;min-width:450px}canvas{width:100%;height:100%;display:block}aside{width:345px;padding:18px;overflow:auto}button,select{padding:9px;margin:4px;background:#363c4f;color:white;border:1px solid #777;border-radius:5px;cursor:pointer}label{display:block;margin:6px 0}fieldset{margin:12px 0;border:1px solid #505567}input{width:155px}output{display:inline-block;min-width:45px}p{line-height:1.6}.hint{color:#c5c6cd;font-size:13px}#status{color:#f4d87a;white-space:pre-wrap}#expr-grid{display:none}</style>
<header><b id="model-badge">正在加载 P2-05 候选…</b>　<span class="hint">仅候选调校；不会写入正式目录</span></header><main><section id="viewport-container"><canvas id="review-canvas"></canvas></section><aside>
<h3>A 偏粗短尾巴</h3><p>55.3 cm，最宽约 19.0 cm。使用实际 VRM 弹簧关节参数；以下控制为本卡评审夹具。</p>
<div><button data-view="front">正面</button><button data-view="threeQuarter">3/4</button><button data-view="back">背面</button><button id="background">黑/白背景</button></div>
<label>预设 <select id="preset"><option value="light">轻盈</option><option value="standard">标准</option><option value="calm">A 原沉稳</option><option value="heavyBalanced" selected>B 加重·留惯性（已选）</option><option value="heavyDamped">C 加重·快收稳</option></select></label>
<p><a href="./heavy-comparison.html" style="color:#f4d87a">三组同动作并排对比／视频</a></p>
<fieldset><legend>日常动态预览</legend><label><input id="idle" type="checkbox" style="width:auto"> 开启待机（呼吸、重心、视线、眨眼）</label><label><input id="slow-turn" type="checkbox" style="width:auto"> 加入缓慢转身</label><p class="hint">开启后在角色画面移动鼠标，观察眼睛、头和颈的跟随。可边播放边切换轻盈／标准／沉稳。关闭待机或点击停止可归零。</p></fieldset>
<div id="parameters"></div><button id="play">快速拖动诊断（30 秒＋5 秒回稳）</button><button id="stop">停止／归零</button><button id="save">保存候选参数到 D 盘</button>
<p class="hint">待机复用 P3-01，缓慢转身仅用于候选预览。日常预览与快速诊断独立播放。所有修改仅在当前预览和候选配置中，不能替代抖动验收。</p><p id="status"></p></aside></main>
