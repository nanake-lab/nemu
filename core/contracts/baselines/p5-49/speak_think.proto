syntax = "proto3";
package nemu.echo.v1;
import "base.proto";
import "cognition.proto";
import "ledger.proto";
import "state.proto";
import "terminal.proto";

enum RemoteAttemptStatus {
  REMOTE_ATTEMPT_UNSPECIFIED = 0;
  REMOTE_ATTEMPT_COMPLETED = 1;
  REMOTE_ATTEMPT_TRUNCATED = 2;
  REMOTE_ATTEMPT_CANCELLED = 3;
  REMOTE_ATTEMPT_SERVICE_FAULT = 4;
  REMOTE_ATTEMPT_CONTENT_REFUSED = 5;
  REMOTE_ATTEMPT_NOT_SENT = 6;
}

enum TextAdoption {
  TEXT_ADOPTION_UNSPECIFIED = 0;
  TEXT_ADOPTION_FULL = 1;
  TEXT_ADOPTION_RANGE = 2;
  TEXT_ADOPTION_REJECTED = 3;
  TEXT_ADOPTION_STALE = 4;
  TEXT_ADOPTION_NO_TEXT = 5;
}

enum RemoteTextMode {
  REMOTE_TEXT_UNSPECIFIED = 0;
  REMOTE_TEXT_INTERNAL_TEXT_ONLY_THINKING_OFF = 1;
}

enum RelationFact {
  REL_FACT_UNSPECIFIED = 0;
  REL_FACT_REPLY = 1;
  REL_FACT_QUOTATION = 2;
  REL_FACT_PARAPHRASE = 3;
  REL_FACT_SOURCE_LOCATOR = 4;
  REL_FACT_CORRECTION = 5;
  REL_FACT_RETRACTION = 6;
  REL_FACT_CONTRADICTION_ANNOTATION = 7;
  REL_FACT_TEACHING_ANNOTATION = 8;
  REL_FACT_ACCEPTED_FALSIFICATION = 9;
  REL_FACT_SAME_EVENT_HINT = 10;
  REL_FACT_CONTACT = 11;
  REL_FACT_EVIDENCE_MEMBER = 12;
  REL_FACT_GOVERNED_MERGE = 13;
  REL_FACT_REINTERPRETATION = 14;
  REL_FACT_SEMANTIC_LINK = 15;
  REL_FACT_PROPOSAL_SOURCE = 16;
  REL_FACT_EFFECT_PROVENANCE = 17;
  REL_FACT_MIGRATION = 18;
  REL_FACT_TRANSACTION_MEMBER = 19;
  REL_FACT_LEDGER_REFERENCE = 20;
  REL_FACT_ACTIVITY_PREVIOUS = 21;
  REL_FACT_MATERIAL_READ = 22;
  REL_FACT_PRODUCT_SOURCE = 23;
  REL_FACT_ACTION_DEPENDENCY = 24;
  REL_FACT_OUTPUT_DELIVERY = 25;
  REL_FACT_PERMISSION_SNAPSHOT = 26;
  REL_FACT_USE_REVOKED = 27;
  REL_FACT_UNRESOLVED = 28;
}

enum PresentationChannel {
  PRESENTATION_UNSPECIFIED = 0;
  PRESENTATION_DISPLAY = 1;
  PRESENTATION_AUDIO = 2;
}

// @message echo.utf8-range | ADR 0045 §§3–5; ADR 0046
message Utf8Range {
  optional uint32 schema_version = 1; // required
  optional uint64 start = 2; // required
  optional uint64 end = 3; // required
}

// @message echo.record-version | ADR 0045 §§3–5; ADR 0046
message RecordVersion {
  optional uint32 schema_version = 1; // required
  optional string branch_id = 2; // required,nonempty
  optional string record_id = 3; // required,nonempty
  optional ObjectRef content = 4; // required
}

// @message echo.quote-layer | ADR 0045 §§3–5; ADR 0046
message QuoteLayer {
  optional uint32 schema_version = 1; // required
  optional RecordVersion source = 2; // required
  optional Utf8Range visible = 3; // required
  optional string principal_id = 4; // required,nonempty
  optional ObjectRef identity_evidence = 5; // required
}

// @message echo.speaker-attribution | ADR 0045 §§3–5; ADR 0046
message SpeakerAttribution {
  optional uint32 schema_version = 1; // required
  repeated QuoteLayer layers = 2; // required
  optional ObjectRef governance = 3; // required
}

// @message echo.record-relation | ADR 0045 §§3–5; ADR 0046
message RecordRelation {
  optional uint32 schema_version = 1; // required
  optional RelationFact kind = 2; // required
  optional RecordVersion origin = 3; // required
  optional RecordVersion target = 4; // required
  optional string purpose = 5; // required,nonempty
  optional string effective_commit = 6; // required,nonempty
  optional ObjectRef governance = 7; // required
}

// @message echo.relation-set | ADR 0045 §3; ADR 0046
message RelationSet {
  optional uint32 schema_version = 1; // required
  optional RecordVersion endpoint = 2; // required
  optional string purpose = 3; // required,nonempty
  optional string frontier = 4; // required,nonempty
  repeated RecordRelation relations = 5; // required
}

// @message echo.relation-query-receipt | ADR 0045 §3; ADR 0046
message RelationQueryReceipt {
  optional uint32 schema_version = 1; // required
  optional RelationSet result = 2; // required
  optional ObjectRef manifest = 3; // required
  optional uint64 expected_count = 4; // required
}

// @message echo.remote-cognitive-receipt | ADR 0045 §§3–5; ADR 0046
message RemoteCognitiveReceipt {
  // @rules {"discriminator":"status","common":["binding","provider","requested_model","provider_revision","model_sha256","tokenizer_sha256","mode","parameters","format","mapping","meter","input_manifest","local_pause_reason","adoption"],"cases":{"1":{"required":["capacity","output_reserve","sent_request","request_sha256","returned_model","raw_response","finish_reason"],"optional":["returned_text","usage","reason","accepted_range","product","review"],"values":{"adoption":[1,2,3,4,5]}},"2":{"required":["capacity","output_reserve","sent_request","request_sha256","returned_model","raw_response","finish_reason"],"optional":["returned_text","usage","reason","accepted_range","product","review"],"values":{"adoption":[2,3,4,5]}},"3":{"required":["capacity","output_reserve","sent_request","request_sha256","reason"],"optional":["returned_model","raw_response","finish_reason","returned_text","usage","review"],"values":{"adoption":[3,4,5]}},"4":{"required":["capacity","output_reserve","sent_request","request_sha256","reason"],"optional":["returned_model","raw_response","finish_reason","returned_text","usage","review"],"values":{"adoption":[3,4,5]}},"5":{"required":["capacity","output_reserve","sent_request","request_sha256","reason"],"optional":["returned_model","raw_response","finish_reason","returned_text","usage","review"],"values":{"adoption":[3,4,5]}},"6":{"required":["reason"],"optional":["capacity","output_reserve"],"values":{"adoption":[5]}}}}
  optional uint32 schema_version = 1; // required
  optional CognitionBinding binding = 2; // required
  optional string provider = 3; // required,nonempty
  optional string requested_model = 4; // required,nonempty
  optional string returned_model = 5; // optional,nonempty
  optional string provider_revision = 6; // optional,nonempty
  optional bytes model_sha256 = 7; // optional,size=32
  optional bytes tokenizer_sha256 = 8; // optional,size=32
  optional RemoteTextMode mode = 9; // required
  optional ObjectRef parameters = 10; // required
  optional ObjectRef format = 11; // required
  optional ObjectRef mapping = 12; // required
  optional ObjectRef meter = 13; // required
  optional uint64 capacity = 14; // optional
  optional uint64 output_reserve = 15; // optional
  optional ObjectRef input_manifest = 16; // required
  optional ObjectRef sent_request = 17; // optional
  optional bytes request_sha256 = 18; // optional,size=32
  optional ObjectRef raw_response = 19; // optional
  optional ObjectRef returned_text = 20; // optional
  optional string finish_reason = 21; // optional,nonempty
  optional ObjectRef usage = 22; // optional
  optional RemoteAttemptStatus status = 23; // required
  optional string reason = 24; // optional,nonempty
  optional TextAdoption adoption = 25; // required
  optional Utf8Range accepted_range = 26; // optional
  optional CognitiveMaterial product = 27; // optional
  optional ObjectRef review = 28; // optional
  optional string local_pause_reason = 29; // optional,nonempty
}

// @message echo.internal-activity-record-v2 | ADR 0045 §§3–5; ADR 0046
message InternalActivityRecordV2 {
  // @retains InternalActivityRecord
  reserved 4;
  optional uint32 schema_version = 1; // required
  optional string record_id = 2; // required,nonempty
  optional ObjectRef previous = 3; // optional
  optional uint64 started_at_ns = 5; // required
  optional uint64 finished_at_ns = 6; // required
  oneof result { // required
    CognitiveResultAndReceipt local = 7; // optional
    RemoteCognitiveReceipt remote = 8; // optional
  }
}

// @message echo.internal-activity-commit-v2 | ADR 0045 §§3–5; ADR 0046
message InternalActivityCommitV2 {
  // @retains InternalActivityCommit
  reserved 3;
  optional uint32 schema_version = 1; // required
  optional CognitionBinding binding = 2; // required
  repeated ObjectRef interpretations = 4; // required
  optional InternalActivityRecordV2 activity = 5; // required
}

// @message echo.transaction-v4 | ADR 0045 §§3–5; ADR 0046
message CoreTransactionV4 {
  // @retains CoreTransactionV3
  reserved 2, 15, 18;
  optional uint32 schema_version = 1; // required
  optional ObjectRef staged_h = 3; // required
  optional ObjectRef staged_x = 4; // required
  optional ObjectRef staged_r = 5; // required
  optional ObjectRef staged_theta = 6; // required
  optional ObjectRef staged_l = 7; // required
  optional ObjectRef staged_q = 8; // required
  optional ObjectRef staged_u = 9; // required
  optional uint64 processed_position = 10; // required
  optional uint64 anchor_time_ns = 11; // required
  repeated ObjectRef staged_concepts = 12; // required
  repeated ObjectRef accepted_results = 13; // required
  repeated ObjectRef audit_refs = 14; // required
  repeated LedgerEntry staged_ledger = 16; // required
  oneof origin { // required
    ProposalBindingV2 event_binding = 17; // optional
    InternalActivityCommitV2 activity_commit = 19; // optional
  }
}

// @message echo.speech-delivery-v2 | ADR 0045 §§3–5; ADR 0046
message SpeechDeliveryV2 {
  // @retains SpeechDelivery
  reserved 4, 5;
  optional uint32 schema_version = 1; // required
  optional string action_id = 2; // required,nonempty
  optional string output_id = 3; // required,nonempty
  optional DeliveryStatus status = 6; // required
  optional PresentationChannel channel = 7; // required
  optional RecordVersion presentation = 8; // required
  repeated Utf8Range delivered = 9; // required
}
