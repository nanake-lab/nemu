[package]
name = "fact-view"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
core-types.workspace = true
core-store.workspace = true
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "hooks", "limits"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
sqlite-vec = "=0.1.9"
time = { version = "=0.3.44", default-features = false, features = ["std", "parsing", "alloc"] }
fastembed = { version = "=7.3.0", default-features = false, features = ["ort-download-binaries-rustls-tls"], optional = true }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-24"], optional = true }

[features]
cpu-embedding = ["dep:fastembed", "dep:ort"]

[dev-dependencies]
tempfile = "=3.27.0"
