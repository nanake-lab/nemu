[package]
name = "gateway"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
core-types.workspace = true
core-store.workspace = true
tokio = { version = "=1.54.1", features = ["io-util", "net", "rt", "time", "sync", "macros"] }
zeroize = "=1.9.1"
subtle = "=2.6.1"
serde_json = "=1.0.154"
sha2 = "=0.11.1"
getrandom = "=0.4.3"

[build-dependencies]
serde_json = "=1.0.154"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Memory"] }

[dev-dependencies]
tempfile = "=3.27.0"
