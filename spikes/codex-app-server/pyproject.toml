[project]
name = "nemu-p0-08-irl-spike"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["lm-format-enforcer==0.11.3", "jsonschema==4.26.0"]

[dependency-groups]
dev = ["mypy==1.20.2", "ruff==0.15.6"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
